<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111111">FUJISOKU SRAM Utility v2.3 - hardware connection overview</text>
  <text x="20" y="44" font-size="11" fill="#555555">solid boxes = required, dashed boxes = optional (USE_SD / USE_LCD / USE_SRAM62256 in config.h)</text>

  <!-- PC -->
  <rect x="20" y="60" width="200" height="74" rx="6" fill="#eef0fb" stroke="#2c3393" stroke-width="1.5"/>
  <text x="30" y="80" font-weight="bold" fill="#111111">PC (Chrome / Edge)</text>
  <text x="30" y="98" font-size="11" fill="#333333">webapp/FSRAM-Utility.html (Web Serial)</text>
  <text x="30" y="114" font-size="11" fill="#333333">or any serial terminal</text>
  <text x="30" y="128" font-size="10" fill="#555555">115200 bps, line commands</text>
  <path d="M220,97 H286" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="228" y="90" font-size="11" fill="#333333">USB</text>

  <!-- Arduino -->
  <rect x="290" y="60" width="440" height="74" rx="6" fill="#e8f0fe" stroke="#1a4fa0" stroke-width="1.5"/>
  <text x="302" y="82" font-size="13" font-weight="bold" fill="#111111">Arduino UNO R4</text>
  <text x="302" y="100" font-size="11" fill="#333333">SPI: D13 SCK, D12 MISO, D11 MOSI (every access in SPI.beginTransaction, 4 MHz)</text>
  <text x="302" y="116" font-size="11" fill="#333333">I2C: A4 SDA, A5 SCL</text>

  <!-- LCD -->
  <rect x="770" y="60" width="210" height="96" rx="6" fill="#e9f0ff" stroke="#1846c4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="780" y="80" font-weight="bold" fill="#111111">LCD 20 x 4 (optional)</text>
  <text x="780" y="98" font-size="11" fill="#333333">HD44780 + PCF8574 backpack</text>
  <text x="780" y="114" font-size="11" fill="#333333">I2C address 0x27 (or 0x3F)</text>
  <text x="780" y="130" font-size="11" fill="#333333">5 V, GND, SDA, SCL</text>
  <text x="780" y="146" font-size="10" fill="#555555">USE_LCD; auto-detected at boot</text>
  <path d="M730,97 H766" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="736" y="90" font-size="11" fill="#333333">I2C</text>

  <!-- shared SPI bus -->
  <path d="M320,134 V180 H955" fill="none" stroke="#1a4fa0" stroke-width="3"/>
  <text x="330" y="174" font-size="11" fill="#1a4fa0">SPI bus (SCK / MISO / MOSI)</text>
  <g stroke="#1a4fa0" stroke-width="2.5" fill="none">
    <path d="M440,180 V230"/>
    <path d="M640,180 V230"/>
    <path d="M955,180 V230"/>
  </g>
  <g fill="#1a4fa0">
    <circle cx="440" cy="180" r="3.5"/>
    <circle cx="640" cy="180" r="3.5"/>
    <circle cx="955" cy="180" r="3.5"/>
  </g>

  <!-- chip-select lines -->
  <g stroke="#333333" stroke-width="1.5" fill="none">
    <path d="M390,134 V228" marker-end="url(#arr)"/>
    <path d="M590,134 V228" marker-end="url(#arr)"/>
    <path d="M790,170 V228" marker-end="url(#arr)"/>
  </g>
  <path d="M700,134 V160 H790 V170" fill="none" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" fill="#333333">
    <text x="396" y="214">D7 /CS</text>
    <text x="596" y="214">D6 /CS</text>
    <text x="796" y="204">D4 /CS (MCP p11)</text>
    <text x="796" y="218">D5 /RESET (MCP p18)</text>
  </g>

  <!-- SPI devices -->
  <rect x="360" y="230" width="170" height="80" rx="6" fill="#f3f4f6" stroke="#555555" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="370" y="252" font-weight="bold" fill="#111111">SD card (optional)</text>
  <text x="370" y="270" font-size="11" fill="#333333">SdFat, *.bin (32,768 B)</text>
  <text x="370" y="286" font-size="11" fill="#333333">hot-swap between commands</text>
  <text x="370" y="302" font-size="10" fill="#555555">USE_SD; D7 kept high if 0</text>

  <rect x="560" y="230" width="170" height="80" rx="6" fill="#f3f4f6" stroke="#555555" stroke-width="1.3"/>
  <text x="570" y="250" font-weight="bold" fill="#111111">SPI SRAM (23LC512)</text>
  <text x="570" y="268" font-size="11" fill="#333333">data buffer (required)</text>
  <text x="570" y="284" font-size="11" fill="#333333">sequential mode at boot</text>
  <text x="570" y="300" font-size="10" fill="#555555">/CS = D6 only (not via MCP)</text>

  <rect x="760" y="230" width="220" height="80" rx="6" fill="#fff4e0" stroke="#b36b00" stroke-width="1.5"/>
  <text x="770" y="250" font-weight="bold" fill="#111111">MCP23S17 x 2  (ch6, ch7)</text>
  <text x="770" y="268" font-size="11" fill="#333333">SCK p12, SI p13, SO p14</text>
  <text x="770" y="284" font-size="11" fill="#333333">common /CS p11, /RESET p18</text>
  <text x="770" y="300" font-size="10" fill="#555555">IOCON = 0x8C (BANK=1, HAEN)</text>

  <!-- MCP -> ch6 / ch7 -->
  <path d="M820,310 V335 H480 V358" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M880,310 V358" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ch6 -->
  <rect x="340" y="360" width="280" height="86" rx="6" fill="#fff4e0" stroke="#b36b00" stroke-width="1.5"/>
  <text x="350" y="380" font-weight="bold" fill="#111111">MCP23S17 ch6  (address bus)</text>
  <text x="350" y="402" font-size="11" font-family="monospace" fill="#333333">GPA0-GPA7 = A0-A7   (F16-F23)</text>
  <text x="350" y="420" font-size="11" font-family="monospace" fill="#333333">GPB0-GPB7 = A8-A15  (F24-F31)</text>
  <text x="350" y="437" font-size="10" fill="#555555">output only while accessing</text>

  <!-- ch7 -->
  <rect x="640" y="360" width="340" height="132" rx="6" fill="#fff4e0" stroke="#b36b00" stroke-width="1.5"/>
  <text x="650" y="380" font-weight="bold" fill="#111111">MCP23S17 ch7  (data + control)</text>
  <text x="650" y="400" font-size="11" font-family="monospace" fill="#333333">GPA0-GPA7 = D0-D7         (F8-F15)</text>
  <text x="650" y="416" font-size="11" font-family="monospace" fill="#333333">GPB0 CS2 (F5)    GPB1 /OE (F7)</text>
  <text x="650" y="432" font-size="11" font-family="monospace" fill="#333333">GPB3 /WE (F6)    GPB4 /CE1 (F4)</text>
  <text x="650" y="448" font-size="11" font-family="monospace" fill="#333333">GPB6 A16 (F32)   GPB7 A17 (F33)</text>
  <text x="650" y="466" font-size="11" font-family="monospace" fill="#333333">GPB2 62256 /OE   GPB5 unused</text>
  <text x="650" y="484" font-size="10" fill="#555555">GPB0 is also /CS of the 62256 (low = 62256)</text>

  <!-- legend -->
  <rect x="20" y="360" width="300" height="132" rx="6" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
  <text x="32" y="382" font-weight="bold" fill="#111111">Legend</text>
  <path d="M32,402 H70" stroke="#1a4fa0" stroke-width="3"/>
  <text x="80" y="406" font-size="11" fill="#333333">shared SPI bus</text>
  <path d="M32,422 H70" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="80" y="426" font-size="11" fill="#333333">chip select / signal flow</text>
  <rect x="32" y="436" width="38" height="14" rx="3" fill="#f3f4f6" stroke="#555555" stroke-dasharray="5,3"/>
  <text x="80" y="447" font-size="11" fill="#333333">optional part</text>
  <text x="32" y="474" font-size="11" fill="#333333">D3 = MCP INT (input, not used)</text>
  <text x="32" y="488" font-size="11" fill="#333333">D2, D8, D9, D10: free (TFT removed in v2)</text>

  <!-- parallel bus -->
  <path d="M380,446 V526" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="388" y="490" font-size="11" fill="#333333">A0-A15</text>
  <path d="M850,492 V526" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="858" y="514" font-size="11" fill="#333333">D0-D7, A16-A17, control</text>

  <rect x="340" y="528" width="640" height="26" rx="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="660" y="545" font-size="11" text-anchor="middle" fill="#111111">parallel bus: A0-A17, D0-D7, /CE1 CE2 /WE /OE</text>

  <path d="M490,554 V586" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M830,554 V586" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- memories -->
  <rect x="340" y="590" width="300" height="80" rx="6" fill="#e6f6ea" stroke="#1e7a3c" stroke-width="1.5"/>
  <text x="350" y="610" font-weight="bold" fill="#111111">FUJISOKU SRAM memory card</text>
  <text x="350" y="628" font-size="11" fill="#333333">38-pin slot F1-F38 (ZIP), see fujisoku-mcp-wiring.svg</text>
  <text x="350" y="644" font-size="11" fill="#333333">accessed range 0x0000-0x7FFF (32 KB)</text>
  <text x="350" y="660" font-size="10" fill="#555555">slot extender: 40-pin 2-row header + 1.27 mm adapter</text>

  <rect x="680" y="590" width="300" height="80" rx="6" fill="#f0e9fa" stroke="#6b3fa0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="690" y="610" font-weight="bold" fill="#111111">62256 parallel SRAM (optional)</text>
  <text x="690" y="628" font-size="11" fill="#333333">A0-A14, D0-D7, /CS = GPB0, /OE = GPB2, /WE = GPB3</text>
  <text x="690" y="644" font-size="11" fill="#333333">test SRAM: USE_SRAM62256 = 1, target p</text>
  <text x="690" y="660" font-size="10" fill="#555555">"test p" checks D0-D7 and A0-A14</text>

  <text x="20" y="690" font-size="11" fill="#555555">Sources: note.com/cheekysmokey (card pin-out, MCP wiring, slot repair articles) and FUJISOKU_SRAM_COPY/config.h. Supply voltage and level shifting are not covered here.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#333333"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7a3c"/>
    </marker>
    <marker id="arrgs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1e7a3c"/>
    </marker>
  </defs>
  <rect width="1000" height="860" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111111">FUJISOKU SRAM Utility v3.0 - hardware connection overview</text>
  <text x="20" y="44" font-size="11" fill="#555555">Arduino UNO R4 + shield board rev 2.0 + slot unit. Solid boxes = required, dashed boxes = optional (USE_SD / USE_LCD / USE_SPI_SRAM in config.h).</text>

  <!-- PC -->
  <rect x="20" y="60" width="200" height="74" rx="6" fill="#eef0fb" stroke="#2c3393" stroke-width="1.5"/>
  <text x="30" y="80" font-weight="bold" fill="#111111">PC (Chrome / Edge)</text>
  <text x="30" y="98" font-size="11" fill="#333333">webapp/FSRAM-Utility.html</text>
  <text x="30" y="114" font-size="11" fill="#333333">(Web Serial) or a serial terminal</text>
  <text x="30" y="128" font-size="10" fill="#555555">115200 bps, line commands</text>
  <path d="M220,97 H286" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="232" y="90" font-size="11" fill="#333333">USB</text>

  <!-- Arduino -->
  <rect x="290" y="60" width="440" height="74" rx="6" fill="#e8f0fe" stroke="#1a4fa0" stroke-width="1.5"/>
  <text x="302" y="82" font-size="13" font-weight="bold" fill="#111111">Arduino UNO R4 (Minima / WiFi)</text>
  <text x="302" y="100" font-size="11" fill="#333333">SPI: D13 SCK, D12 MISO, D11 MOSI (every access in SPI.beginTransaction, 4 MHz)</text>
  <text x="302" y="116" font-size="11" fill="#333333">I2C: A4 SDA, A5 SCL.  D2 = /CARD DET, A2 = BATT-DET</text>
  <text x="302" y="129" font-size="10" fill="#555555">the shield stacks on the Arduino headers</text>

  <!-- LCD -->
  <rect x="770" y="60" width="210" height="96" rx="6" fill="#e9f0ff" stroke="#1846c4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="780" y="80" font-weight="bold" fill="#111111">LCD 20 x 4 (optional)</text>
  <text x="780" y="98" font-size="11" fill="#333333">HD44780 + PCF8574 backpack</text>
  <text x="780" y="114" font-size="11" fill="#333333">I2C address 0x27 (default)</text>
  <text x="780" y="130" font-size="11" fill="#333333">to J3 on the shield (5V GND SDA SCL)</text>
  <text x="780" y="146" font-size="10" fill="#555555">USE_LCD; auto-detected at boot</text>
  <path d="M730,97 H766" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="736" y="90" font-size="11" fill="#333333">I2C</text>

  <!-- ===== shield board ===== -->
  <rect x="20" y="168" width="960" height="430" rx="10" fill="#faf8fd" stroke="#6b4fa0" stroke-width="2"/>
  <text x="34" y="190" font-size="13" font-weight="bold" fill="#4b2f80">Shield board rev 2.0</text>
  <text x="34" y="207" font-size="11" fill="#4b2f80">68.58 x 53.34 mm, 2 layers, 1.6 mm</text>
  <text x="34" y="222" font-size="11" fill="#4b2f80">all through-hole / DIP (hardware/kicad/shield/)</text>

  <!-- shared SPI bus -->
  <path d="M320,134 V214 H955" fill="none" stroke="#1a4fa0" stroke-width="3"/>
  <text x="400" y="208" font-size="11" fill="#1a4fa0">SPI bus (SCK / MISO / MOSI)</text>
  <g stroke="#1a4fa0" stroke-width="2.5" fill="none">
    <path d="M440,214 V240"/>
    <path d="M640,214 V240"/>
    <path d="M955,214 V334"/>
  </g>
  <g fill="#1a4fa0">
    <circle cx="440" cy="214" r="3.5"/>
    <circle cx="640" cy="214" r="3.5"/>
    <circle cx="955" cy="214" r="3.5"/>
  </g>
  <!-- chip selects from the Arduino -->
  <path d="M390,134 V236" stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="396" y="232" font-size="11" fill="#333333">D7 /CS</text>
  <path d="M590,134 V236" stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="596" y="232" font-size="11" fill="#333333">D6 /CS</text>
  <path d="M700,134 V160 H790 V330" stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="796" y="232" font-size="11" fill="#333333">D4 /CS (MCP p11, both)</text>
  <text x="796" y="246" font-size="11" fill="#333333">D5 /RESET (MCP p18, both)</text>

  <!-- J2 SD -->
  <rect x="360" y="240" width="170" height="74" rx="6" fill="#f3f4f6" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="370" y="259" font-weight="bold" fill="#111111">J2: SD module (opt.)</text>
  <text x="370" y="276" font-size="11" fill="#333333">5 V SD module, jumper</text>
  <text x="370" y="291" font-size="11" fill="#333333">wires by silk names</text>
  <text x="370" y="306" font-size="10" fill="#555555">USE_SD; D7 kept high if 0</text>

  <!-- U3 SPI SRAM -->
  <rect x="560" y="240" width="170" height="74" rx="6" fill="#f3f4f6" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="570" y="259" font-weight="bold" fill="#111111">U3: 23LC512 (opt.)</text>
  <text x="570" y="276" font-size="11" fill="#333333">SPI SRAM 64 KB buffer</text>
  <text x="570" y="291" font-size="11" fill="#333333">USE_SPI_SRAM; auto-detect</text>
  <text x="570" y="306" font-size="10" fill="#555555">/CS = D6 only</text>

  <!-- R1 / C / direct lines -->
  <rect x="34" y="240" width="290" height="110" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.2"/>
  <text x="44" y="259" font-weight="bold" fill="#111111">Direct to the Arduino</text>
  <text x="44" y="277" font-size="11" fill="#333333">F37 /CARD DET -&gt; D2 (INPUT_PULLUP, L = card in)</text>
  <text x="44" y="293" font-size="11" fill="#333333">F2 BATT-DET -&gt; A2, R1 1 MΩ A2 to GND</text>
  <text x="44" y="309" font-size="11" fill="#333333">F3 / F36 = +5 V, F1 / F38 = GND</text>
  <text x="44" y="327" font-size="11" fill="#333333">C1-C3 0.1 µF (U1-U3), C4 10 µF (card 5 V)</text>
  <text x="44" y="342" font-size="10" fill="#555555">D3, D8-D10, A0, A1, A3: not used</text>

  <!-- U1 ch6 -->
  <rect x="340" y="334" width="290" height="100" rx="6" fill="#fff4e0" stroke="#b36b00" stroke-width="1.5"/>
  <text x="350" y="354" font-weight="bold" fill="#111111">U1: MCP23S17 ch6 (address)</text>
  <text x="350" y="370" font-size="10" fill="#555555">A2:A0 = 110, opcode 0x4C / 0x4D</text>
  <text x="350" y="390" font-family="Menlo, Consolas, monospace" font-size="11" fill="#333333">GPA0-GPA7 = A0-A7  (F16-F23)</text>
  <text x="350" y="407" font-family="Menlo, Consolas, monospace" font-size="11" fill="#333333">GPB0-GPB7 = A8-A15 (F24-F31)</text>
  <text x="350" y="426" font-size="10" fill="#555555">outputs only while accessing</text>

  <!-- U2 ch7 -->
  <rect x="650" y="334" width="320" height="140" rx="6" fill="#fff4e0" stroke="#b36b00" stroke-width="1.5"/>
  <text x="660" y="354" font-weight="bold" fill="#111111">U2: MCP23S17 ch7 (data + control)</text>
  <text x="660" y="370" font-size="10" fill="#555555">A2:A0 = 111, opcode 0x4E / 0x4F, IOCON 0x8C</text>
  <text x="660" y="390" font-family="Menlo, Consolas, monospace" font-size="11" fill="#333333">GPA0-GPA7 = D0-D7   (F8-F15)</text>
  <text x="660" y="407" font-family="Menlo, Consolas, monospace" font-size="11" fill="#333333">GPB0 CE2  (F5)  GPB1 /OE (F7)</text>
  <text x="660" y="424" font-family="Menlo, Consolas, monospace" font-size="11" fill="#333333">GPB2 /CE1 (F4)  GPB3 /WE (F6)</text>
  <text x="660" y="441" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#8a3b00">GPB4-GPB7 = A16-A19 (F32-F35)</text>
  <text x="660" y="463" font-size="10" fill="#555555">v3.0: no 62256; up to 1 MB cards (A0-A19)</text>

  <!-- J1 -->
  <rect x="340" y="514" width="630" height="70" rx="6" fill="#e6f6ea" stroke="#1e7a3c" stroke-width="1.8"/>
  <text x="352" y="534" font-weight="bold" fill="#111111">J1: keyed MIL female socket 2 x 20 (40P, 2.54 mm, vertical) - key toward U1 (back)</text>
  <text x="352" y="552" font-size="11" fill="#333333">pin 2k-1 = F2k, pin 2k = F2k-1 (1 = F2, 2 = F1, 3 = F4, 4 = F3 ... 37 = F38, 38 = F37), 39 / 40 not connected</text>
  <text x="352" y="570" font-size="10" fill="#555555">same pin order as the slot unit's box header; the key stops reverse insertion</text>

  <!-- U1/U2 to J1 -->
  <path d="M485,434 V510" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="492" y="478" font-size="11" fill="#333333">A0-A15</text>
  <path d="M810,474 V510" stroke="#333333" stroke-width="2" fill="none" marker-start="url(#arrs)" marker-end="url(#arr)"/>
  <text x="802" y="497" font-size="11" fill="#333333" text-anchor="end">D0-D7, CE2 /OE /CE1 /WE, A16-A19</text>
  <!-- J1 to direct box -->
  <path d="M340,549 H180 V354" stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="188" y="540" font-size="11" fill="#333333">F2, F37, power</text>

  <!-- ===== slot unit ===== -->
  <path d="M655,640 V590" stroke="#1e7a3c" stroke-width="3" fill="none" marker-end="url(#arrg)"/>
  <text x="664" y="620" font-size="11" font-weight="bold" fill="#1e7a3c">plugs straight into J1 (keyed)</text>

  <rect x="340" y="640" width="420" height="112" rx="6" fill="#e6f6ea" stroke="#1e7a3c" stroke-width="1.5"/>
  <text x="352" y="660" font-weight="bold" fill="#111111">Slot unit</text>
  <text x="352" y="678" font-size="11" fill="#333333">card slot taken from a U-BOX (38-pin ZIP; the FUJISOKU slot is discontinued)</text>
  <text x="352" y="694" font-size="11" fill="#333333">+ 4 x Akizuki 2.54 mm (2x5) to 1.27 mm (1x10) adapters, mounted flipped</text>
  <text x="352" y="710" font-size="11" fill="#333333">+ right-angle keyed box header 2 x 20</text>
  <text x="352" y="727" font-size="11" fill="#333333">header: 1 = F2, 2 = F1 (lower row), 3 = F4 ... 38 = F37, 39 / 40 free</text>
  <text x="352" y="743" font-size="10" fill="#555555">build notes and photos: docs/hardware.md section 12</text>

  <!-- card -->
  <rect x="20" y="640" width="280" height="112" rx="6" fill="#e6f6ea" stroke="#1e7a3c" stroke-width="1.5"/>
  <text x="32" y="660" font-weight="bold" fill="#111111">FUJISOKU SRAM memory card</text>
  <text x="32" y="678" font-size="11" fill="#333333">38 pins F1-F38 (see fujisoku-mcp-wiring.svg)</text>
  <text x="32" y="694" font-size="11" fill="#333333">32 KB standard; up to 1 MB via the PC</text>
  <text x="32" y="710" font-size="11" fill="#333333">(A0-A19). Standalone ops: first 32 KB</text>
  <text x="32" y="727" font-size="11" fill="#333333">label face toward the back of the shield</text>
  <path d="M300,696 H336" stroke="#1e7a3c" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/>
  <text x="302" y="684" font-size="10" fill="#1e7a3c">insert</text>

  <!-- U-BOX (alternative) -->
  <rect x="800" y="640" width="180" height="112" rx="6" fill="#f3f4f6" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="810" y="660" font-weight="bold" fill="#111111">U-BOX (instead)</text>
  <text x="810" y="678" font-size="11" fill="#333333">pattern processor CN2:</text>
  <text x="810" y="694" font-size="11" fill="#333333">box header with legs</text>
  <text x="810" y="710" font-size="11" fill="#333333">bent to the ZIP layout</text>
  <text x="810" y="727" font-size="11" fill="#333333">CN2 pin 1 (F1) = header 2</text>
  <text x="810" y="743" font-size="10" fill="#555555">via straight 40-wire ribbon</text>
  <path d="M760,696 H796" stroke="#555555" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)"/>

  <!-- legend -->
  <rect x="20" y="776" width="960" height="52" rx="6" fill="#fafafa" stroke="#bbbbbb"/>
  <path d="M34,796 H74" stroke="#1a4fa0" stroke-width="3"/>
  <text x="82" y="800" font-size="11" fill="#333333">shared SPI bus</text>
  <path d="M174,796 H210" stroke="#333333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="218" y="800" font-size="11" fill="#333333">chip select / signal</text>
  <path d="M330,796 H366" stroke="#1e7a3c" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="374" y="800" font-size="11" fill="#333333">card / slot connection</text>
  <rect x="510" y="789" width="36" height="14" rx="3" fill="#f3f4f6" stroke="#555555" stroke-dasharray="4,2"/>
  <text x="554" y="800" font-size="11" fill="#333333">optional / alternative</text>
  <text x="34" y="819" font-size="11" fill="#8a3b00">v3.0 (branch wo62256): ch7 GPB remapped, F34 / F35 driven by U2 GPB6 / GPB7 (v2.8: GND). Not yet checked on the board.</text>

  <text x="20" y="848" font-size="11" fill="#555555">Sources: note.com/cheekysmokey (card pin-out, MCP wiring, slot articles), FUJISOKU_SRAM_COPY/config.h and the KiCad data. Single 5 V supply; all parts are 5 V, no level shifting.</text>
</svg>
